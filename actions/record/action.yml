name: siftwise record
description: >-
  Upload the run's JUnit reports to siftwise (use with if: always()). In a single job, also
  triage the run's failures into the PR comment and job summary. Optionally re-run unknown
  failures (rerun-unknown). Never fails the job unless fail-on is set: problems are warnings.
inputs:
  server-url:
    description: siftwise server URL (e.g. secrets.SIFTWISE_URL).
    required: true
  token:
    description: siftwise API token (e.g. secrets.SIFTWISE_TOKEN). Empty means skip, with a warning.
    required: false
    default: ""
  repo:
    description: Repository name in siftwise.
    required: false
    default: ${{ github.repository }}
  base-ref:
    description: Diff base for the recorded changed files; same default as actions/select.
    required: false
    default: ""
  junit:
    description: >-
      Glob(s) of JUnit XML files, whitespace-separated. The select step's junit-dir is always
      included.
    required: false
    default: "**/junit*.xml"
  junit-dir:
    description: >-
      Extra directory of JUnit reports (default: the one actions/select used).
    required: false
    default: ""
  variant:
    description: >-
      Matrix leg, e.g. "<os>-py<python>" from the matrix. Each leg is its own run; set
      it in a matrix, and add an actions/rollup job after the matrix.
    required: false
    default: ""
  defer-rollup:
    description: >-
      'auto' (defer when variant is set), 'true' or 'false'. Deferred stats are updated by
      actions/rollup.
    required: false
    default: auto
  github-token:
    description: >-
      Reads the run's start time from the Actions API (needs actions read) and writes the
      PR comment's failures section (needs pull-requests write).
    required: false
    default: ${{ github.token }}
  triage:
    description: >-
      'auto' (triage unless the rollup is deferred, i.e. in a single job), 'true' or 'false'.
      After a matrix, actions/rollup triages every leg at once.
    required: false
    default: auto
  comment:
    description: Add the failures to the sticky PR comment when triaging.
    required: false
    default: "true"
  fail-on:
    description: >-
      Comma-separated verdicts that fail this step, e.g. "new_regression,unknown". Off by
      default: siftwise then never fails anything. When set, unavailable verdicts (server
      down or erroring, nothing recorded) also fail the step; without a siftwise token (fork
      PRs) it only warns: that run is not gated.
    required: false
    default: ""
  known-flaky-source:
    description: >-
      Whose .siftwise.toml known_flaky list triage applies to a pull request: 'base' (the PR
      base commit's, so a PR can't mark its own failures flaky and get past fail-on; edits
      apply after merge) or 'head' (the checkout's). Pushes always use their own.
    required: false
    default: base
  rerun-unknown:
    description: >-
      Re-run this leg's failures whose verdict is in rerun-verdicts up to this many times
      (0-3; 0 = off) with their own runner (pytest, Go, Jest, Maven or Gradle), and record each
      re-run: a test that passes on one becomes flaky ("passed on re-run"). Never fails the step.
    required: false
    default: "0"
  rerun-verdicts:
    description: "Verdicts to re-run: 'unknown' (default) or 'unknown,new_regression'."
    required: false
    default: unknown
  rerun-max-tests:
    description: Most failing tests re-run (1-100).
    required: false
    default: "20"
  rerun-timeout-minutes:
    description: Time limit for all re-runs together (1-60 minutes); a re-run cut off is discarded.
    required: false
    default: "10"
  rerun-prefix:
    description: >-
      Command prefix for pytest and Jest, e.g. 'uv run', 'poetry run' or 'npx' (split like a
      shell would, run without a shell). Go, Maven and Gradle don't use it: siftwise runs
      gotestsum (if on PATH) or go test -json, and ./mvnw or ./gradlew if present.
    required: false
    default: ""
outputs:
  verdicts-available:
    description: "'true' if the run's failures were triaged, else 'false'."
    value: ${{ steps.record.outputs.verdicts-available }}
  counts:
    description: >-
      JSON object of failing tests per verdict (new_regression, unknown, flaky,
      pre_existing); each test counts once, under its worst verdict over the variants.
    value: ${{ steps.record.outputs.counts }}
  report:
    description: Path of the Markdown failures report (what went to the job summary).
    value: ${{ steps.record.outputs.report }}
  shadow:
    description: "'true' if this run was a shadow run that siftwise compared, else 'false'."
    value: ${{ steps.record.outputs.shadow }}
  shadow-mode:
    description: "In a shadow run, what siftwise would have done: 'selective' or 'full'."
    value: ${{ steps.record.outputs.shadow-mode }}
  shadow-caught:
    description: >-
      In a counted shadow run, failing tests the selection would have run (flaky ones not
      counted).
    value: ${{ steps.record.outputs.shadow-caught }}
  shadow-missed:
    description: In a counted shadow run, failing tests the selection would have skipped.
    value: ${{ steps.record.outputs.shadow-missed }}
  rerun-tests:
    description: With rerun-unknown, how many failing tests were re-run.
    value: ${{ steps.record.outputs.rerun-tests }}
  rerun-passed:
    description: With rerun-unknown, how many of them passed on a re-run (now flaky).
    value: ${{ steps.record.outputs.rerun-passed }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false
    - name: Install siftwise
      shell: bash
      run: uv tool install --quiet --force --python 3.12 "$GITHUB_ACTION_PATH/../.."
    - id: record
      name: Record results
      shell: bash
      env:
        SIFTWISE_SERVER: ${{ inputs.server-url }}
        SIFTWISE_API_TOKEN: ${{ inputs.token }}
        SIFTWISE_REPO: ${{ inputs.repo }}
        SIFTWISE_BASE_REF: ${{ inputs.base-ref }}
        SIFTWISE_JUNIT_GLOB: ${{ inputs.junit }}
        # Falls back to the directory the select step exported to the job's environment.
        SIFTWISE_JUNIT_DIR: ${{ inputs.junit-dir || env.SIFTWISE_JUNIT_DIR }}
        SIFTWISE_VARIANT: ${{ inputs.variant }}
        SIFTWISE_DEFER_ROLLUP: ${{ inputs.defer-rollup }}
        SIFTWISE_GITHUB_TOKEN: ${{ inputs.github-token }}
        SIFTWISE_TRIAGE: ${{ inputs.triage }}
        SIFTWISE_COMMENT: ${{ inputs.comment }}
        SIFTWISE_FAIL_ON: ${{ inputs.fail-on }}
        SIFTWISE_KNOWN_FLAKY_SOURCE: ${{ inputs.known-flaky-source }}
        SIFTWISE_RERUN_UNKNOWN: ${{ inputs.rerun-unknown }}
        SIFTWISE_RERUN_VERDICTS: ${{ inputs.rerun-verdicts }}
        SIFTWISE_RERUN_MAX_TESTS: ${{ inputs.rerun-max-tests }}
        SIFTWISE_RERUN_TIMEOUT_MINUTES: ${{ inputs.rerun-timeout-minutes }}
        SIFTWISE_RERUN_PREFIX: ${{ inputs.rerun-prefix }}
      run: '"$(uv tool dir --bin)/siftwise" gha record'
