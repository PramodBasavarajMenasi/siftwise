name: siftwise select
description: >-
  Pick the tests a change needs from its test history. Falls back to the full suite whenever
  unsure, including when siftwise is unreachable: it never blocks CI.
inputs:
  server-url:
    description: siftwise server URL (e.g. secrets.SIFTWISE_URL).
    required: true
  token:
    description: >-
      siftwise API token (e.g. secrets.SIFTWISE_TOKEN). Empty on pull requests from forks,
      which then run the full suite.
    required: false
    default: ""
  repo:
    description: Repository name in siftwise.
    required: false
    default: ${{ github.repository }}
  base-ref:
    description: >-
      Diff base. Default: the PR's base commit; for pushes, the commit before the push.
    required: false
    default: ""
  junit-dir:
    description: >-
      Directory for the JUnit reports of the selected pytest commands (default:
      $RUNNER_TEMP/siftwise-junit). actions/record picks them up.
    required: false
    default: ""
  comment:
    description: >-
      Post or update the sticky PR comment. In a matrix, enable it for one leg only (the
      expression strategy.job-index == 0), or every leg races to post it.
    required: false
    default: "true"
  github-token:
    description: Token for the PR comment (needs pull-requests write).
    required: false
    default: ${{ github.token }}
  shadow:
    description: >-
      Shadow mode, to measure recall: 'off' (default), 'always', or a percentage of CI runs
      such as '10%'. A shadow run outputs mode full and an empty command (run your full suite)
      while siftwise stores what it would have selected; actions/rollup (or record in a single
      job) then reports the failures that selection would have caught or missed. Sampled by
      a hash of the run ID, so every matrix leg agrees. Never fails or shortens a run; an
      invalid value is a warning and turns it off.
    required: false
    default: "off"
  order:
    description: >-
      'risk' (default): the command lists the selected tests most likely to fail first
      (pytest runs its arguments in order; Go packages run one after another; Jest may still
      reorder files across its workers). 'default': by path, package and test ID. Never
      changes which tests run; an invalid value is a warning and means risk.
    required: false
    default: risk
  budget:
    description: >-
      Time budget, e.g. '5m', '90s' or '1h' (empty, the default: none). An estimated target,
      not a hard cap: estimates are each test's mean duration, so a run can take longer (on the
      eval replays, up to 1.4x at 25-50% budgets, more when the riskiest unit alone is over).
      Runs only the highest-risk selected tests (whole files, Go packages, Jest files) whose
      estimated time fits; when siftwise would run the full suite, the full suite's known tests
      are packed the same way. A budget-limited run is NOT a complete check: the comment shows
      the estimated time against the target and how many tests were left out. An invalid value
      is a warning and means no budget; a server too old for budgets means the full suite,
      with a warning.
    required: false
    default: ""
  variant:
    description: >-
      Matrix leg, the same value as actions/record's variant. Only matters in shadow runs:
      each leg's selection is stored for its own variant (legs can differ, e.g. Go graphs per
      OS). Empty: one selection for every leg of the run.
    required: false
    default: ""
outputs:
  mode:
    description: "'selective' or 'full'. In full mode, run your normal full-suite command."
    value: ${{ steps.select.outputs.mode }}
  command:
    description: >-
      The test command (shell-quoted, for eval) when mode is selective; empty there means no
      tests are affected.
    value: ${{ steps.select.outputs.command }}
  selected:
    description: Number of known tests selected.
    value: ${{ steps.select.outputs.selected }}
  total:
    description: Number of known tests.
    value: ${{ steps.select.outputs.total }}
  reason:
    description: Why the full suite runs, or a summary of the selection.
    value: ${{ steps.select.outputs.reason }}
  junit-dir:
    description: Where the selected pytest commands write their JUnit reports.
    value: ${{ steps.select.outputs.junit-dir }}
  shadow:
    description: "'true' if this is a shadow run (mode is then full), else 'false'."
    value: ${{ steps.select.outputs.shadow }}
  shadow-mode:
    description: >-
      In a shadow run, what siftwise would have done: 'selective' or 'full'. Empty otherwise,
      or if siftwise couldn't select.
    value: ${{ steps.select.outputs.shadow-mode }}
  shadow-selected:
    description: In a shadow run, the number of known tests siftwise would have selected.
    value: ${{ steps.select.outputs.shadow-selected }}
  shadow-total:
    description: In a shadow run, the number of known tests.
    value: ${{ steps.select.outputs.shadow-total }}
  budget-limited:
    description: "'true' if the time budget left selected tests out: not a complete check."
    value: ${{ steps.select.outputs.budget-limited }}
  budget-left-out:
    description: Selected tests the time budget left out (0 without a budget).
    value: ${{ steps.select.outputs.budget-left-out }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false  # the cache key would come from the caller's repo, not this action
    - name: Install siftwise
      shell: bash
      # From this action's own checkout, not PyPI: the CLI always matches the action's ref.
      run: uv tool install --quiet --force --python 3.12 "$GITHUB_ACTION_PATH/../.."
    - id: select
      name: Select tests
      shell: bash
      env:
        SIFTWISE_SERVER: ${{ inputs.server-url }}
        SIFTWISE_API_TOKEN: ${{ inputs.token }}
        SIFTWISE_REPO: ${{ inputs.repo }}
        SIFTWISE_BASE_REF: ${{ inputs.base-ref }}
        SIFTWISE_JUNIT_DIR: ${{ inputs.junit-dir }}
        SIFTWISE_COMMENT: ${{ inputs.comment }}
        SIFTWISE_GITHUB_TOKEN: ${{ inputs.github-token }}
        SIFTWISE_SHADOW: ${{ inputs.shadow }}
        SIFTWISE_VARIANT: ${{ inputs.variant }}
        SIFTWISE_ORDER: ${{ inputs.order }}
        SIFTWISE_BUDGET: ${{ inputs.budget }}
      run: '"$(uv tool dir --bin)/siftwise" gha select'
