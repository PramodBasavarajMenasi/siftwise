name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, types, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # Postgres is the runner's preinstalled one (16), not a service container: anonymous image
    # pulls from Docker Hub and from AWS's public mirror both hit rate limits on shared runners
    # ("toomanyrequests").
    env:
      # Without it the database tests are skipped.
      SIFTWISE_TEST_DATABASE_URL: postgresql+psycopg://siftwise:siftwise@localhost:5432/siftwise_test

    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          for _ in $(seq 30); do pg_isready -h localhost -q && break; sleep 1; done
          # Superuser: the migration tests create and drop a scratch database.
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE siftwise LOGIN SUPERUSER PASSWORD 'siftwise'"
          sudo -u postgres createdb -O siftwise siftwise_test

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: mypy
        run: uv run mypy src tests scripts

      - name: pytest
        run: uv run pytest
