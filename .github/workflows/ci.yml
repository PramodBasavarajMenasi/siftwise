name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, types, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # Postgres is the runner's preinstalled one (16), not a service container: anonymous image
    # pulls from Docker Hub and from AWS's public mirror both hit rate limits on shared runners
    # ("toomanyrequests").
    env:
      # Without it the database tests are skipped.
      SIFTWISE_TEST_DATABASE_URL: postgresql+psycopg://siftwise:siftwise@localhost:5432/siftwise_test

    steps:
      - uses: actions/checkout@v7

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          for _ in $(seq 30); do pg_isready -h localhost -q && break; sleep 1; done
          # Superuser: the migration tests create and drop a scratch database.
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE siftwise LOGIN SUPERUSER PASSWORD 'siftwise'"
          sudo -u postgres createdb -O siftwise siftwise_test

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: mypy
        run: uv run mypy src tests scripts

      - name: pytest
        run: uv run pytest

  # rerun-unknown's runners against the real tools (tests/test_reruns.py's *_for_real tests,
  # skipped by the job above): minutes of downloads, so one job, Python 3.12 only. With
  # SIFTWISE_REAL_TOOL_TESTS=1 a missing tool fails the test instead of skipping it. Maven and
  # Gradle are the runner image's own.
  real-tools:
    name: re-run runners (Go, gotestsum, Jest, Maven, Gradle)
    runs-on: ubuntu-latest
    env:
      SIFTWISE_REAL_TOOL_TESTS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false  # no go.sum here

      - name: Install gotestsum
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Jest and jest-junit
        run: |
          mkdir -p "$RUNNER_TEMP/jest"
          cd "$RUNNER_TEMP/jest"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --silent jest@29.7.0 jest-junit@16.0.0
          echo "SIFTWISE_TEST_JEST_HOME=$RUNNER_TEMP/jest" >> "$GITHUB_ENV"

      # setup-java caches one build tool per call. The test projects (POM, build.gradle) are
      # in tests/test_reruns.py, so it keys both caches.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: tests/test_reruns.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: tests/test_reruns.py

      - name: Install dependencies
        run: uv sync --locked

      - name: Real-tool tests
        run: uv run pytest tests/test_reruns.py -k for_real --durations=0

  package:
    name: package (build, twine check, light/server/mcp installs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # `uv build` builds the wheel from the sdist, so a file missing from the sdist fails here.
      - name: Build the sdist and wheel
        run: uv build

      # twine check, the sdist's file list, and the wheel in fresh venvs: the light install has
      # none of the server's modules, and `siftwise server start` there names the extra.
      - name: Check the distributions
        run: uv run --no-project python scripts/check_dist.py dist
