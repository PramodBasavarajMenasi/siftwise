name: Release

# On a version tag (v0.1.0.dev0, v0.1.0, ...): check the tag matches __version__, build and check
# the distributions, publish them with trusted publishing (no stored token), and push the server
# image to GHCR (linux/amd64) once the distributions passed their checks.
# Dev and pre-release versions (.devN, aN, bN, rcN) go to TestPyPI (environment `testpypi`),
# every other version to PyPI (environment `pypi`). Only X.Y.Z moves the image's `latest`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: tag matches the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/siftwise/__init__.py)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match __version__ $version (src/siftwise/__init__.py)"
            exit 1
          fi
          # Only a final release (X.Y.Z) moves `latest`; dev, alpha, beta and rc versions don't.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then stable=true; else stable=false; fi
          # Dev and pre-releases go to TestPyPI, never PyPI (post-releases go to PyPI).
          if [[ "$version" =~ (\.dev|a|b|rc)[0-9]+ ]]; then prerelease=true; else prerelease=false; fi
          # GHCR image names must be lower-case.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/siftwise"
          echo "$version: stable=$stable prerelease=$prerelease"
          {
            echo "version=$version"
            echo "stable=$stable"
            echo "prerelease=$prerelease"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build and check the distributions
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - run: uv build

      # twine check, the sdist's file list, light/server/mcp installs in fresh venvs.
      - run: uv run --no-project python scripts/check_dist.py dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: publish to TestPyPI
    needs: [check, build]
    if: needs.check.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/siftwise/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write  # trusted publishing: TestPyPI trusts this workflow + environment
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    needs: [check, build]
    if: needs.check.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/siftwise/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write  # trusted publishing: PyPI trusts this workflow + environment
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    name: push the server image to GHCR
    # After the distributions passed check_dist: a broken build publishes nothing.
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.check.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.check.outputs.version }}
            type=raw,value=latest,enable=${{ needs.check.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.check.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
