name: Quickstart

# Runs the README Quickstart (scripts/run_quickstart.py): the compose stack from scratch, the
# light CLI, the example project's first run and selection. Against THIS checkout: the server
# image is built (`--build`) and the CLI installed from `.`, where the README uses the released
# image and PyPI; every other command runs as written. The image job builds the server image
# for both release platforms (linux/amd64 and linux/arm64), without pushing.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - README.md
      - examples/**
      - src/**
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - pyproject.toml
      - uv.lock
      - scripts/run_quickstart.py
      - .github/workflows/quickstart.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickstart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Anonymous Docker Hub pulls hit rate limits on shared runners ("toomanyrequests"):
      # pull python and postgres through Google's Docker Hub mirror. Same images, same digests.
      - name: Use a Docker Hub mirror
        run: |
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # uv only: the quickstart installs the CLI with `uv tool install` itself.
      - uses: astral-sh/setup-uv@v7

      # Prints the server's logs if it fails; stops the server and deletes its volume either way.
      - name: Run the README Quickstart
        run: python3 scripts/run_quickstart.py

  # The release pushes one image for linux/amd64 and linux/arm64 (release.yml): build both
  # here, without pushing, so an arm64-only break shows up before a tag. In parallel with the
  # quickstart job.
  image:
    name: server image builds (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # The same Docker Hub mirror as above, for BuildKit's own pulls (python, uv).
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=image-multiarch
          cache-to: type=gha,scope=image-multiarch,mode=max
