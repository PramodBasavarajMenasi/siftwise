name: Action e2e

# Dogfoods actions/select, record and rollup on siftwise itself, against a real server: an
# empty history (full suite), recording this run's JUnit (plus one deliberately failing test),
# the rollup's failure verdicts in the job summary and PR comment, fail-on, a second selection
# that sees the history, and the fail-open paths (server down, no token, shallow clone).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read          # record reads the run's start time
  pull-requests: write   # the sticky PR comment: select's selection, rollup's failures

concurrency:
  group: action-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVER: http://localhost:8000
  TOKEN: e2e-token
  DOWN: http://127.0.0.1:9   # nothing listens here: the fail-open checks

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Postgres is the runner's preinstalled one (16), not a service container: image pulls from
    # Docker Hub and from AWS's public mirror both hit rate limits on shared runners
    # ("toomanyrequests: Data limit exceeded" failed this job before any step ran).
    env:
      SIFTWISE_API_TOKEN: e2e-token   # the server's token
      SIFTWISE_DATABASE_URL: postgresql+psycopg://siftwise:siftwise@localhost:5432/siftwise
      # The repo's own test suite uses a separate database on the same server.
      SIFTWISE_TEST_DATABASE_URL: postgresql+psycopg://siftwise:siftwise@localhost:5432/siftwise_test
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 0  # select diffs against the PR base

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          for _ in $(seq 30); do pg_isready -h localhost -q && break; sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE siftwise LOGIN SUPERUSER PASSWORD 'siftwise'"
          sudo -u postgres createdb -O siftwise siftwise
          sudo -u postgres createdb -O siftwise siftwise_test

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Start a siftwise server
        run: |
          uv run alembic upgrade head
          # The venv's uvicorn, not `uv run`: a uv process left running holds the uv cache lock,
          # and setup-uv's post-job `uv cache prune` then times out waiting for it.
          nohup .venv/bin/uvicorn siftwise.api.main:app --port 8000 > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for _ in $(seq 60); do curl -sf "$SERVER/healthz" && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: Select (empty history)
        id: first
        uses: ./actions/select
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}
          comment: false

      - name: Check the first selection
        env:
          MODE: ${{ steps.first.outputs.mode }}
          REASON: ${{ steps.first.outputs.reason }}
        run: |
          test "$MODE" = full
          test "$REASON" = "no test history for this repo yet"

      - name: Tests (full suite, JUnit into the select step's directory)
        env:
          JUNIT_DIR: ${{ steps.first.outputs.junit-dir }}
        run: uv run pytest --junitxml="$JUNIT_DIR/full.xml"

      # A test that always fails, written outside the checkout, so triage has a failure to give
      # a verdict. Its own rootdir makes its ID test_e2e_failing::test_e2e_always_fails. It's
      # new (no history before this run) and its file isn't in the diff, so the verdict is
      # `unknown` (rule 4).
      - name: A deliberately failing test (for triage)
        env:
          JUNIT_DIR: ${{ steps.first.outputs.junit-dir }}
        run: |
          dir="$RUNNER_TEMP/e2e_failing"
          mkdir -p "$dir"
          printf 'def test_e2e_always_fails():\n    assert 1 == 2\n' > "$dir/test_e2e_failing.py"
          if uv run pytest "$dir/test_e2e_failing.py" --rootdir "$dir" -p no:cacheprovider \
              --junitxml="$JUNIT_DIR/e2e-failing.xml"; then
            echo "the deliberately failing test passed"; exit 1
          fi
          # Nothing the e2e run creates may show up in the checkout.
          git status --porcelain
          test -z "$(git status --porcelain)"

      # Even when the tests fail (that's when results matter), but only with a checkout: the
      # actions live in it.
      - name: "Record (a matrix-style leg: deferred rollup, no triage)"
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: ./actions/record
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}
          variant: e2e

      - name: Rollup (triages the run's failures; comments on the PR)
        id: rollup
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: ./actions/rollup
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}

      - name: Check the failure verdict in the job summary
        env:
          AVAILABLE: ${{ steps.rollup.outputs.verdicts-available }}
          COUNTS: ${{ steps.rollup.outputs.counts }}
          REPORT: ${{ steps.rollup.outputs.report }}
        run: |
          cat "$REPORT"
          test "$AVAILABLE" = true
          echo "$COUNTS" | jq -e '.unknown == 1 and .new_regression == 0'
          # The report is what went to the job summary; Markdown-escaped, one variant.
          grep -F '<code>test\_e2e\_failing::test\_e2e\_always\_fails</code> | unknown | low |' "$REPORT"
          grep -F '### Failures: 1 unknown' "$REPORT"

      - name: Check the recorded run
        run: |
          url="$SERVER/runs/lookup?repo=$GITHUB_REPOSITORY&ci_run_id=$GITHUB_RUN_ID&run_attempt=$GITHUB_RUN_ATTEMPT&variant=e2e"
          run=$(curl -sf -H "Authorization: Bearer $TOKEN" "$url")
          echo "$run"
          # The PR's head commit, not the merge commit actions/checkout tested.
          echo "$run" | jq -e '.commit_sha == env.HEAD_SHA'

      - name: Select (with history; updates the PR comment)
        id: second
        uses: ./actions/select
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}

      - name: Check the second selection
        env:
          MODE: ${{ steps.second.outputs.mode }}
          TOTAL: ${{ steps.second.outputs.total }}
          SELECTED: ${{ steps.second.outputs.selected }}
          COMMAND: ${{ steps.second.outputs.command }}
        run: |
          echo "mode=$MODE selected=$SELECTED total=$TOTAL"
          test "$TOTAL" -gt 0
          case "$MODE" in
            full) test -z "$COMMAND" || [[ "$COMMAND" == pytest* ]] ;;
            selective) test -z "$COMMAND" || [[ "$COMMAND" == *pytest* ]] ;;
            *) exit 1 ;;
          esac

      # Same-repo PRs only: a fork's token can't comment. After the second select, so this also
      # checks that select kept the failures section of the same commit.
      - name: Check the failure verdict in the PR comment
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.body | contains("<!-- siftwise -->")) | .body')
          echo "$body"
          test "$(grep -c -F '<!-- siftwise -->' <<< "$body")" = 1
          grep -F '<!-- siftwise:selection -->' <<< "$body"
          grep -F "<!-- siftwise:failures sha=$HEAD_SHA attempt=$GITHUB_RUN_ATTEMPT -->" <<< "$body"
          grep -F '<code>test\_e2e\_failing::test\_e2e\_always\_fails</code> | unknown | low |' <<< "$body"

      # fail-on: the opt-in way the actions fail a step on purpose (comment: false keeps the
      # real failures section in the PR comment).
      - name: fail-on - a matching verdict fails the step
        id: failon_hit
        continue-on-error: true
        uses: ./actions/rollup
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}
          comment: false
          fail-on: unknown

      - name: fail-on - no matching verdict passes
        id: failon_miss
        uses: ./actions/rollup
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}
          comment: false
          fail-on: new_regression

      - name: Fail open - select with the server down
        id: down
        uses: ./actions/select
        with:
          server-url: ${{ env.DOWN }}
          token: ${{ env.TOKEN }}
          comment: false

      - name: Fail open - select without a token (as on a fork PR)
        id: notoken
        uses: ./actions/select
        with:
          server-url: ${{ env.SERVER }}
          token: ""
          comment: false

      # comment: false on these: "verdicts unavailable" must not replace the real section.
      - name: Fail open - record and rollup with the server down
        id: down_record
        uses: ./actions/record
        with:
          server-url: ${{ env.DOWN }}
          token: ${{ env.TOKEN }}
          comment: false

      - id: down_rollup
        uses: ./actions/rollup
        with:
          server-url: ${{ env.DOWN }}
          token: ${{ env.TOKEN }}
          comment: false

      - name: Fail closed - rollup with the server down and fail-on set
        id: down_failon
        continue-on-error: true
        uses: ./actions/rollup
        with:
          server-url: ${{ env.DOWN }}
          token: ${{ env.TOKEN }}
          comment: false
          fail-on: new_regression

      - name: Check the fail-open selections and verdicts, and fail-on
        env:
          DOWN_MODE: ${{ steps.down.outputs.mode }}
          DOWN_COMMAND: ${{ steps.down.outputs.command }}
          NOTOKEN_MODE: ${{ steps.notoken.outputs.mode }}
          DOWN_RECORD_AVAILABLE: ${{ steps.down_record.outputs.verdicts-available }}
          DOWN_AVAILABLE: ${{ steps.down_rollup.outputs.verdicts-available }}
          DOWN_REPORT: ${{ steps.down_rollup.outputs.report }}
          FAILON_HIT: ${{ steps.failon_hit.outcome }}
          FAILON_MISS: ${{ steps.failon_miss.outcome }}
          DOWN_FAILON: ${{ steps.down_failon.outcome }}
        run: |
          test "$DOWN_MODE" = full
          test -z "$DOWN_COMMAND"  # the workflow runs its own full-suite command
          test "$NOTOKEN_MODE" = full
          test "$DOWN_RECORD_AVAILABLE" = false  # single-job record triages: nothing recorded
          test "$DOWN_AVAILABLE" = false
          grep -F 'Failure verdicts unavailable: could not reach siftwise' "$DOWN_REPORT"
          echo "fail-on: hit=$FAILON_HIT miss=$FAILON_MISS down=$DOWN_FAILON"
          test "$FAILON_HIT" = failure
          test "$FAILON_MISS" = success
          test "$DOWN_FAILON" = failure   # fail closed: fail-on is set

      - name: Server log
        if: failure()
        run: |
          cat "$RUNNER_TEMP/server.log" 2>/dev/null || echo "no server log: the server never started"

      # Before the post-job steps (setup-uv prunes its cache there): nothing left running.
      - name: Stop the siftwise server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/server.pid" ]; then kill "$(cat "$RUNNER_TEMP/server.pid")" || true; fi

  shallow:
    # select can't diff a shallow clone: its one deliberate failure, with a clear message.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # fetch-depth 1
      - name: Select on a shallow clone
        id: select
        continue-on-error: true
        uses: ./actions/select
        with:
          server-url: http://127.0.0.1:9
          comment: false
      - name: Check that it failed
        env:
          OUTCOME: ${{ steps.select.outcome }}
        run: test "$OUTCOME" = failure
