name: Action e2e

# Dogfoods actions/select, record and rollup on siftwise itself, against a real server: an
# empty history (full suite), recording this run's JUnit (plus one deliberately failing test),
# the rollup's failure verdicts in the job summary and PR comment, fail-on, a second selection
# that sees the history, the fail-open paths (server down, no token, shallow clone), a shadow
# run (full suite, the stored selection's caught and missed failures), known_flaky from the
# checkout or the PR base, and rerun-unknown (a test that fails once, then passes: flaky).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read          # record reads the run's start time
  pull-requests: write   # the sticky PR comment: select's selection, rollup's failures

concurrency:
  group: action-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVER: http://localhost:8000
  TOKEN: e2e-token
  DOWN: http://127.0.0.1:9   # nothing listens here: the fail-open checks

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Postgres is the runner's preinstalled one (16), not a service container: image pulls from
    # Docker Hub and from AWS's public mirror both hit rate limits on shared runners
    # ("toomanyrequests: Data limit exceeded" failed this job before any step ran).
    env:
      SIFTWISE_API_TOKEN: e2e-token   # the server's token
      SIFTWISE_DATABASE_URL: postgresql+psycopg://siftwise:siftwise@localhost:5432/siftwise
      # The repo's own test suite uses a separate database on the same server.
      SIFTWISE_TEST_DATABASE_URL: postgresql+psycopg://siftwise:siftwise@localhost:5432/siftwise_test
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 0  # select diffs against the PR base

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          for _ in $(seq 30); do pg_isready -h localhost -q && break; sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE siftwise LOGIN SUPERUSER PASSWORD 'siftwise'"
          sudo -u postgres createdb -O siftwise siftwise
          sudo -u postgres createdb -O siftwise siftwise_test

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Start a siftwise server
        run: |
          uv run alembic upgrade head
          # The venv's uvicorn, not `uv run`: a uv process left running holds the uv cache lock,
          # and setup-uv's post-job `uv cache prune` then times out waiting for it.
          nohup .venv/bin/uvicorn siftwise.api.main:app --port 8000 > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for _ in $(seq 60); do curl -sf "$SERVER/healthz" && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: Select (empty history)
        id: first
        uses: ./actions/select
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}
          comment: false

      - name: Check the first selection
        env:
          MODE: ${{ steps.first.outputs.mode }}
          REASON: ${{ steps.first.outputs.reason }}
        run: |
          test "$MODE" = full
          test "$REASON" = "no test history for this repo yet"

      - name: Tests (full suite, JUnit into the select step's directory)
        env:
          JUNIT_DIR: ${{ steps.first.outputs.junit-dir }}
        run: uv run pytest --junitxml="$JUNIT_DIR/full.xml"

      # A test that always fails, written outside the checkout, so triage has a failure to give
      # a verdict. Its own rootdir makes its ID test_e2e_failing::test_e2e_always_fails. It's
      # new (no history before this run) and its file isn't in the diff, so the verdict is
      # `unknown` (rule 4).
      - name: A deliberately failing test (for triage)
        env:
          JUNIT_DIR: ${{ steps.first.outputs.junit-dir }}
        run: |
          dir="$RUNNER_TEMP/e2e_failing"
          mkdir -p "$dir"
          printf 'def test_e2e_always_fails():\n    assert 1 == 2\n' > "$dir/test_e2e_failing.py"
          if uv run pytest "$dir/test_e2e_failing.py" --rootdir "$dir" -p no:cacheprovider \
              --junitxml="$JUNIT_DIR/e2e-failing.xml"; then
            echo "the deliberately failing test passed"; exit 1
          fi
          # Nothing the e2e run creates may show up in the checkout.
          git status --porcelain
          test -z "$(git status --porcelain)"

      # Even when the tests fail (that's when results matter), but only with a checkout: the
      # actions live in it.
      - name: "Record (a matrix-style leg: deferred rollup, no triage)"
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: ./actions/record
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}
          variant: e2e

      - name: Rollup (triages the run's failures; comments on the PR)
        id: rollup
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: ./actions/rollup
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}

      - name: Check the failure verdict in the job summary
        env:
          AVAILABLE: ${{ steps.rollup.outputs.verdicts-available }}
          COUNTS: ${{ steps.rollup.outputs.counts }}
          REPORT: ${{ steps.rollup.outputs.report }}
        run: |
          cat "$REPORT"
          test "$AVAILABLE" = true
          echo "$COUNTS" | jq -e '.unknown == 1 and .new_regression == 0'
          # The report is what went to the job summary; Markdown-escaped, one variant.
          grep -F '<code>test\_e2e\_failing::test\_e2e\_always\_fails</code> | unknown | low |' "$REPORT"
          grep -F '### Failures: 1 unknown' "$REPORT"

      - name: Check the recorded run
        run: |
          url="$SERVER/runs/lookup?repo=$GITHUB_REPOSITORY&ci_run_id=$GITHUB_RUN_ID&run_attempt=$GITHUB_RUN_ATTEMPT&variant=e2e"
          run=$(curl -sf -H "Authorization: Bearer $TOKEN" "$url")
          echo "$run"
          # The PR's head commit, not the merge commit actions/checkout tested.
          echo "$run" | jq -e '.commit_sha == env.HEAD_SHA'

      - name: Select (with history; updates the PR comment)
        id: second
        uses: ./actions/select
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}

      - name: Check the second selection
        env:
          MODE: ${{ steps.second.outputs.mode }}
          TOTAL: ${{ steps.second.outputs.total }}
          SELECTED: ${{ steps.second.outputs.selected }}
          COMMAND: ${{ steps.second.outputs.command }}
        run: |
          echo "mode=$MODE selected=$SELECTED total=$TOTAL"
          test "$TOTAL" -gt 0
          case "$MODE" in
            full) test -z "$COMMAND" || [[ "$COMMAND" == pytest* ]] ;;
            selective) test -z "$COMMAND" || [[ "$COMMAND" == *pytest* ]] ;;
            *) exit 1 ;;
          esac

      # Same-repo PRs only: a fork's token can't comment. After the second select, so this also
      # checks that select kept the failures section of the same commit.
      - name: Check the failure verdict in the PR comment
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.body | contains("<!-- siftwise -->")) | .body')
          echo "$body"
          test "$(grep -c -F '<!-- siftwise -->' <<< "$body")" = 1
          grep -F '<!-- siftwise:selection -->' <<< "$body"
          grep -F "<!-- siftwise:failures sha=$HEAD_SHA attempt=$GITHUB_RUN_ATTEMPT -->" <<< "$body"
          grep -F '<code>test\_e2e\_failing::test\_e2e\_always\_fails</code> | unknown | low |' <<< "$body"

      # fail-on: the opt-in way the actions fail a step on purpose (comment: false keeps the
      # real failures section in the PR comment).
      - name: fail-on - a matching verdict fails the step
        id: failon_hit
        continue-on-error: true
        uses: ./actions/rollup
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}
          comment: false
          fail-on: unknown

      - name: fail-on - no matching verdict passes
        id: failon_miss
        uses: ./actions/rollup
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}
          comment: false
          fail-on: new_regression

      - name: Fail open - select with the server down
        id: down
        uses: ./actions/select
        with:
          server-url: ${{ env.DOWN }}
          token: ${{ env.TOKEN }}
          comment: false

      - name: Fail open - select without a token (as on a fork PR)
        id: notoken
        uses: ./actions/select
        with:
          server-url: ${{ env.SERVER }}
          token: ""
          comment: false

      # comment: false on these: "verdicts unavailable" must not replace the real section.
      - name: Fail open - record and rollup with the server down
        id: down_record
        uses: ./actions/record
        with:
          server-url: ${{ env.DOWN }}
          token: ${{ env.TOKEN }}
          comment: false

      - id: down_rollup
        uses: ./actions/rollup
        with:
          server-url: ${{ env.DOWN }}
          token: ${{ env.TOKEN }}
          comment: false

      - name: Fail closed - rollup with the server down and fail-on set
        id: down_failon
        continue-on-error: true
        uses: ./actions/rollup
        with:
          server-url: ${{ env.DOWN }}
          token: ${{ env.TOKEN }}
          comment: false
          fail-on: new_regression

      - name: Check the fail-open selections and verdicts, and fail-on
        env:
          DOWN_MODE: ${{ steps.down.outputs.mode }}
          DOWN_COMMAND: ${{ steps.down.outputs.command }}
          NOTOKEN_MODE: ${{ steps.notoken.outputs.mode }}
          DOWN_RECORD_AVAILABLE: ${{ steps.down_record.outputs.verdicts-available }}
          DOWN_AVAILABLE: ${{ steps.down_rollup.outputs.verdicts-available }}
          DOWN_REPORT: ${{ steps.down_rollup.outputs.report }}
          FAILON_HIT: ${{ steps.failon_hit.outcome }}
          FAILON_MISS: ${{ steps.failon_miss.outcome }}
          DOWN_FAILON: ${{ steps.down_failon.outcome }}
        run: |
          test "$DOWN_MODE" = full
          test -z "$DOWN_COMMAND"  # the workflow runs its own full-suite command
          test "$NOTOKEN_MODE" = full
          test "$DOWN_RECORD_AVAILABLE" = false  # single-job record triages: nothing recorded
          test "$DOWN_AVAILABLE" = false
          grep -F 'Failure verdicts unavailable: could not reach siftwise' "$DOWN_REPORT"
          echo "fail-on: hit=$FAILON_HIT miss=$FAILON_MISS down=$DOWN_FAILON"
          test "$FAILON_HIT" = failure
          test "$FAILON_MISS" = success
          test "$DOWN_FAILON" = failure   # fail closed: fail-on is set

      # Shadow mode: the full suite runs while siftwise stores what it would have selected; the
      # rollup then counts the failures that selection caught or missed. Its own variant: this
      # is the same CI run attempt as the steps above (a step can't change GITHUB_RUN_ID). On a
      # PR no signal reliably selects the always-failing test (recently-failed reads main runs
      # only), so an untracked .siftwise.toml pins it with always_run; select diffs commits, so
      # the file is never part of the change. A new failing test that no signal reaches is the
      # miss. A full selection (e.g. a commit touching a workflow) catches both.
      - name: Shadow - pin the always-failing test
        run: printf 'always_run = ["test_e2e_failing::*"]\n' > .siftwise.toml

      - name: Shadow - select (shadow always)
        id: shadow
        uses: ./actions/select
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}
          shadow: always
          variant: shadow-e2e
          junit-dir: ${{ runner.temp }}/shadow-junit

      - name: Shadow - the full suite, plus a new failing test
        env:
          MODE: ${{ steps.shadow.outputs.mode }}
          COMMAND: ${{ steps.shadow.outputs.command }}
          SHADOW: ${{ steps.shadow.outputs.shadow }}
          FIRST_JUNIT: ${{ steps.first.outputs.junit-dir }}
          JUNIT_DIR: ${{ steps.shadow.outputs.junit-dir }}
        run: |
          rm .siftwise.toml
          test "$SHADOW" = true
          test "$MODE" = full     # a shadow run never selects
          test -z "$COMMAND"      # the workflow runs its own full suite
          # This job already ran the full suite and the failing test: their reports stand in.
          cp "$FIRST_JUNIT/full.xml" "$FIRST_JUNIT/e2e-failing.xml" "$JUNIT_DIR/"
          dir="$RUNNER_TEMP/e2e_shadow"
          mkdir -p "$dir"
          printf 'def test_e2e_shadow_new():\n    assert 1 == 2\n' > "$dir/test_e2e_shadow_new.py"
          if uv run pytest "$dir/test_e2e_shadow_new.py" --rootdir "$dir" -p no:cacheprovider \
              --junitxml="$JUNIT_DIR/e2e-shadow-new.xml"; then
            echo "the new failing test passed"; exit 1
          fi
          test -z "$(git status --porcelain)"

      - name: Shadow - record
        uses: ./actions/record
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}
          variant: shadow-e2e
          junit-dir: ${{ steps.shadow.outputs.junit-dir }}

      - name: Shadow - rollup (compares the shadow run; comments on the PR)
        id: shadow_rollup
        uses: ./actions/rollup
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}

      - name: Check the shadow run
        env:
          SHADOW_MODE: ${{ steps.shadow.outputs.shadow-mode }}
          SELECTED: ${{ steps.shadow.outputs.shadow-selected }}
          TOTAL: ${{ steps.shadow.outputs.shadow-total }}
          ROLLUP_SHADOW: ${{ steps.shadow_rollup.outputs.shadow }}
          ROLLUP_MODE: ${{ steps.shadow_rollup.outputs.shadow-mode }}
          CAUGHT: ${{ steps.shadow_rollup.outputs.shadow-caught }}
          MISSED: ${{ steps.shadow_rollup.outputs.shadow-missed }}
          REPORT: ${{ steps.shadow_rollup.outputs.report }}
          # `siftwise report` reads its token from here (the job sets it too; explicit for the
          # CLI calls below).
          SIFTWISE_API_TOKEN: ${{ env.TOKEN }}
        run: |
          cat "$REPORT"
          echo "would have run $SELECTED of $TOTAL ($SHADOW_MODE): caught=$CAUGHT missed=$MISSED"
          test "$ROLLUP_SHADOW" = true
          test "$ROLLUP_MODE" = "$SHADOW_MODE"
          recall=$(curl -sf -H "Authorization: Bearer $TOKEN" \
            "$SERVER/repos/$GITHUB_REPOSITORY/recall?days=1")
          echo "$recall" | jq .
          # Both failures are new to this attempt's history (triage leaves out the whole
          # attempt), so neither is flaky: each counts as caught or missed.
          echo "$recall" | jq -e '.shadow_runs == 1 and .all.failures == 2 and .all.flaky_excluded == 0'
          case "$SHADOW_MODE" in
            selective)
              # Pinned by always_run: caught. New, outside every signal: missed, as a new test
              # (no result before this run).
              test "$CAUGHT" = 1
              test "$MISSED" = 1
              grep -F 'and caught 1 of 2 failures' "$REPORT"
              grep -F -- '- <code>test\_e2e\_shadow\_new::test\_e2e\_shadow\_new</code>: new test (verdict: unknown)' "$REPORT"
              echo "$recall" | jq -e '.selective_runs == 1 and .selective.caught == 1
                and .selective.missed == 1 and .all.missed_by_verdict.unknown == 1
                and .all.missed_by_cause.new_test == 1
                and .misses[0].test_id == "test_e2e_shadow_new::test_e2e_shadow_new"
                and .misses[0].variants == ["shadow-e2e"]
                and .misses[0].cause == "new_test" and .misses[0].suggestion == null'
              report=$(uv run siftwise report --repo "$GITHUB_REPOSITORY" --days 1 --server "$SERVER")
              echo "$report"
              grep -F 'Missed by cause: 1 new test (all runs); 1 new test (selective)' <<< "$report"
              grep -F '      new test: no result for this test before this run' <<< "$report"
              uv run siftwise report --repo "$GITHUB_REPOSITORY" --days 1 --server "$SERVER" --by week \
                | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2} +1 +50\.0% \(1 of 2\) +1 +50\.0% \(1 of 2\) +1 +1 '
              ;;
            full)
              test "$CAUGHT" = 2
              test "$MISSED" = 0
              grep -F 'would have run all' "$REPORT"
              grep -F 'and caught 2 of 2 failures' "$REPORT"
              echo "$recall" | jq -e '.full_runs == 1 and .selective_runs == 0 and .all.missed == 0'
              ;;
            *) echo "unexpected shadow-mode: '$SHADOW_MODE'"; exit 1 ;;
          esac

      # Same-repo PRs only, as above.
      - name: Check the shadow lines in the PR comment
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.body | contains("<!-- siftwise -->")) | .body')
          echo "$body"
          grep -F -- '- **Mode:** full (shadow run)' <<< "$body"
          grep -F '**Shadow run:** would have run' <<< "$body"

      # known_flaky: the always-failing test, listed in an untracked .siftwise.toml. Its own
      # variants of this attempt, checked through the API (verdicts per variant, no comment).
      # known-flaky-source: head applies the checkout's list; the default (base) applies the PR
      # base commit's, which has none: a PR can't mark its own failures flaky. A change to a root
      # build or CI file (this workflow) links every test, and linked + listed is unknown.
      - name: Known flaky - list the always-failing test
        env:
          FIRST_JUNIT: ${{ steps.first.outputs.junit-dir }}
        run: |
          printf 'known_flaky = ["test_e2e_failing::*"]\n' > .siftwise.toml
          mkdir -p "$RUNNER_TEMP/known-flaky-junit"
          cp "$FIRST_JUNIT/e2e-failing.xml" "$RUNNER_TEMP/known-flaky-junit/"

      - name: Known flaky - record (known-flaky-source head)
        uses: ./actions/record
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}
          variant: known-flaky-e2e
          junit-dir: ${{ runner.temp }}/known-flaky-junit
          known-flaky-source: head

      - name: Known flaky - record (the default source)
        uses: ./actions/record
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}
          variant: known-flaky-base-e2e
          junit-dir: ${{ runner.temp }}/known-flaky-junit

      - name: Check the known-flaky verdicts
        run: |
          rm .siftwise.toml
          git status --porcelain
          test -z "$(git status --porcelain)"
          triage() {
            curl -sf -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -d "{\"ci_run_id\": \"$GITHUB_RUN_ID\", \"run_attempt\": $GITHUB_RUN_ATTEMPT, \"variants\": [\"$1\"]}" \
              "$SERVER/repos/$GITHUB_REPOSITORY/triage"
          }
          failing='.results[] | select(.test_id == "test_e2e_failing::test_e2e_always_fails")'
          head=$(triage known-flaky-e2e)
          echo "$head" | jq .
          echo "$head" | jq -e "$failing | .known_flaky == \"test_e2e_failing::*\""
          echo "$head" | jq -e '.variants[0].known_flaky_changed == false'
          if echo "$head" | jq -e "$failing | .evidence.links == []" > /dev/null; then
            echo "$head" | jq -e "$failing | .verdict == \"flaky\" and .confidence == \"medium\"
              and .reasons[0] == \"listed in known_flaky ('test_e2e_failing::*')\""
          else
            echo "$head" | jq -e "$failing | .verdict == \"unknown\"
              and .reasons[0] == \"linked to this change but listed in known_flaky: re-run to tell\""
          fi
          base=$(triage known-flaky-base-e2e)
          echo "$base" | jq .
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # Not on the base commit's list; the PR's own list applies after merge.
            echo "$base" | jq -e "$failing | .known_flaky == null and .verdict != \"flaky\""
            echo "$base" | jq -e '.variants[0].known_flaky_changed == true'
          else
            # A push applies its own list.
            echo "$base" | jq -e "$failing | .known_flaky == \"test_e2e_failing::*\""
          fi

      # rerun-unknown: a test inside the checkout (so its node ID resolves) that fails once,
      # then passes (a marker file outside the checkout). record triages its own variant,
      # re-runs the unknown failures with pytest and records the re-run: the test becomes flaky,
      # "passed on re-run 1". The always-failing test is unknown too, but its file is outside
      # the checkout, so it isn't re-run and stays unknown.
      - name: Re-run - a test that fails the first time only
        env:
          FIRST_JUNIT: ${{ steps.first.outputs.junit-dir }}
        run: |
          junit="$RUNNER_TEMP/rerun-junit"
          mkdir -p "$junit" e2e_rerun
          cp "$FIRST_JUNIT/e2e-failing.xml" "$junit/"
          cat > e2e_rerun/test_e2e_flaky.py <<'EOF'
          import os
          import pathlib

          MARKER = pathlib.Path(os.environ["RUNNER_TEMP"]) / "e2e-flaky-ran"


          def test_e2e_fails_once():
              first = not MARKER.exists()
              MARKER.touch()
              assert not first, "fails the first time only"
          EOF
          if uv run pytest e2e_rerun/test_e2e_flaky.py -p no:cacheprovider \
              --junitxml="$junit/e2e-flaky.xml"; then
            echo "the flaky test passed the first time"; exit 1
          fi

      - name: Re-run - record (rerun-unknown)
        id: rerun
        uses: ./actions/record
        with:
          server-url: ${{ env.SERVER }}
          token: ${{ env.TOKEN }}
          variant: rerun-e2e
          junit-dir: ${{ runner.temp }}/rerun-junit
          rerun-unknown: 1
          rerun-prefix: uv run

      - name: Check the re-run
        env:
          TESTS: ${{ steps.rerun.outputs.rerun-tests }}
          PASSED: ${{ steps.rerun.outputs.rerun-passed }}
        run: |
          rm -r e2e_rerun
          git status --porcelain
          test -z "$(git status --porcelain)"
          echo "re-ran $TESTS test(s), $PASSED passed"
          test "$TESTS" = 1
          test "$PASSED" = 1
          url="$SERVER/runs/lookup?repo=$GITHUB_REPOSITORY&ci_run_id=$GITHUB_RUN_ID&run_attempt=$GITHUB_RUN_ATTEMPT&variant=rerun-e2e&rerun=1"
          curl -sf -H "Authorization: Bearer $TOKEN" "$url" | jq -e '.rerun == 1'
          triage=$(curl -sf -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"ci_run_id\": \"$GITHUB_RUN_ID\", \"run_attempt\": $GITHUB_RUN_ATTEMPT, \"variants\": [\"rerun-e2e\"]}" \
            "$SERVER/repos/$GITHUB_REPOSITORY/triage")
          echo "$triage" | jq .
          echo "$triage" | jq -e '.variants[0].reruns == 1'
          echo "$triage" | jq -e '.results[]
            | select(.test_id == "e2e_rerun.test_e2e_flaky::test_e2e_fails_once")
            | .verdict == "flaky" and .confidence == "high"
              and (.reasons[0] | startswith("passed on re-run 1 of this commit and variant"))'
          echo "$triage" | jq -e '.results[]
            | select(.test_id == "test_e2e_failing::test_e2e_always_fails") | .verdict == "unknown"'

      - name: Server log
        if: failure()
        run: |
          cat "$RUNNER_TEMP/server.log" 2>/dev/null || echo "no server log: the server never started"

      # Before the post-job steps (setup-uv prunes its cache there): nothing left running.
      - name: Stop the siftwise server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/server.pid" ]; then kill "$(cat "$RUNNER_TEMP/server.pid")" || true; fi

  shallow:
    # select can't diff a shallow clone: its one deliberate failure, with a clear message.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # fetch-depth 1
      - name: Select on a shallow clone
        id: select
        continue-on-error: true
        uses: ./actions/select
        with:
          server-url: http://127.0.0.1:9
          comment: false
      - name: Check that it failed
        env:
          OUTCOME: ${{ steps.select.outcome }}
        run: test "$OUTCOME" = failure
