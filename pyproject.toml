[project]
name = "siftwise"
dynamic = ["version"]  # src/siftwise/__init__.py's __version__
description = "Open-source test impact analysis for agent-driven CI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# The light CLI and the GitHub Action's glue: select, record, triage, report, rollup, gha.
# Never add a server dependency here (tests/test_packaging.py checks the CLI imports none).
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# The API server: `siftwise server start|migrate`.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]
# `siftwise mcp`: the MCP server for coding agents.
mcp = ["mcp>=2.3,<3"]

[project.scripts]
siftwise = "siftwise.cli.main:app"

[dependency-groups]
dev = [
    "siftwise[server,mcp]",  # the tests cover every extra
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-defusedxml>=0.7.0.20260504",
    "respx>=0.23.1",
    "httpx2>=2.10",  # what starlette's TestClient uses (and is typed with)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/siftwise/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/siftwise"]

[tool.hatch.build.targets.sdist]
only-include = ["src/siftwise", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples/quickstart"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (incl. E722 bare except)
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "BLE", # blind except
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["scripts", "siftwise", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["siftwise"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/siftwise"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
