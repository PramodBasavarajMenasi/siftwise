# .siftwise.toml for agent-substrate/substrate, used by the eval (substrate itself has none).
#
# internal/e2e/suites/* deploy the whole system (ateapi, atelet, atenet, ...) and test it from
# outside, like kubo's test/cli: no Go import edge connects them to the code they exercise.
# Approximated as "any non-test Go file". Coarse, and it makes most code changes run them.

[[depends]]
tests = "internal/e2e/**"
on = ["**/*.go", "!**/*_test.go", "!internal/e2e/**"]

# Functional tests (e.g. cmd/ateapi/internal/controlapi/functionaltest) start ateapi and
# atelet and talk to them over their APIs: the same kind of binary-level dependency. A change
# to cmd/atecontroller broke them twice with no import edge between the two.
[[depends]]
tests = "**/functionaltest/**"
on = ["**/*.go", "!**/*_test.go", "!**/functionaltest/**"]
