# Development, on top of the quickstart file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Publishes Postgres on 5432 (the tests' SIFTWISE_TEST_DATABASE_URL) and creates the
# siftwise_test database when the volume is first created (docker/initdb).
services:
  postgres:
    ports:
      - "5432:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
