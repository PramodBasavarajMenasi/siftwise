[alembic]
# The scripts ship in the package (src/siftwise/migrations); `siftwise server migrate` runs
# them without this file. Here for development: `uv run alembic upgrade head`.
script_location = siftwise:migrations
prepend_sys_path = src
# sqlalchemy.url is set from SIFTWISE_DATABASE_URL in src/siftwise/migrations/env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
